<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280">
  <!-- Waistband with drawstring -->
  <rect x="90" y="80" width="120" height="18" rx="2" fill="#505050" stroke="#3a3a3a" stroke-width="2"/>

  <!-- Drawstring -->
  <circle cx="140" cy="89" r="3" fill="#FFF"/>
  <circle cx="160" cy="89" r="3" fill="#FFF"/>
  <path d="M140 89 L130 95" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
  <path d="M160 89 L170 95" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Left leg (tapered) -->
  <path d="M90 98 L95 140 L105 200 L115 245 L125 245 L130 235 L132 200 L138 140 L145 98 Z"
        fill="#808080" stroke="#505050" stroke-width="3"/>

  <!-- Right leg (tapered) -->
  <path d="M155 98 L162 140 L168 200 L170 235 L175 245 L185 245 L195 200 L205 140 L210 98 Z"
        fill="#808080" stroke="#505050" stroke-width="3"/>

  <!-- Side stripe (athletic style) -->
  <path d="M95 140 L105 200 L115 245" stroke="#FFF" stroke-width="4"/>
  <path d="M205 140 L195 200 L185 245" stroke="#FFF" stroke-width="4"/>

  <!-- Ankle cuffs (ribbed) -->
  <rect x="115" y="240" width="10" height="8" fill="#505050" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="116" y1="242" x2="124" y2="242" stroke="#3a3a3a" stroke-width="1"/>
  <line x1="116" y1="246" x2="124" y2="246" stroke="#3a3a3a" stroke-width="1"/>

  <rect x="175" y="240" width="10" height="8" fill="#505050" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="176" y1="242" x2="184" y2="242" stroke="#3a3a3a" stroke-width="1"/>
  <line x1="176" y1="246" x2="184" y2="246" stroke="#3a3a3a" stroke-width="1"/>

  <!-- Side pockets -->
  <path d="M110 110 Q115 115 110 120" stroke="#505050" fill="none" stroke-width="3"/>
  <path d="M190 110 Q185 115 190 120" stroke="#505050" fill="none" stroke-width="3"/>

  <!-- Front seams -->
  <path d="M145 98 L138 140 L132 200 L130 235" stroke="#696969" stroke-width="1.5"/>
  <path d="M155 98 L162 140 L168 200 L170 235" stroke="#696969" stroke-width="1.5"/>
</svg>
