<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <!-- Waistband -->
  <rect x="100" y="80" width="100" height="10" rx="2" fill="#2C3E50" stroke="#1A252F" stroke-width="2"/>

  <!-- Button -->
  <circle cx="150" cy="85" r="3" fill="#7F8C8D" stroke="#5D6D7E" stroke-width="1"/>

  <!-- Skirt body (A-line mini) -->
  <path d="M100 90 L85 140 L215 140 L200 90 Z"
        fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>

  <!-- Front seam -->
  <line x1="150" y1="90" x2="150" y2="140" stroke="#C0392B" stroke-width="2"/>

  <!-- Side seams -->
  <line x1="105" y1="90" x2="90" y2="140" stroke="#C0392B" stroke-width="2"/>
  <line x1="195" y1="90" x2="210" y2="140" stroke="#C0392B" stroke-width="2"/>

  <!-- Zipper detail -->
  <line x1="195" y1="85" x2="200" y2="100" stroke="#7F8C8D" stroke-width="2"/>

  <!-- Pleats -->
  <line x1="120" y1="90" x2="110" y2="140" stroke="#A93226" stroke-width="1" opacity="0.5"/>
  <line x1="135" y1="90" x2="130" y2="140" stroke="#A93226" stroke-width="1" opacity="0.5"/>
  <line x1="165" y1="90" x2="170" y2="140" stroke="#A93226" stroke-width="1" opacity="0.5"/>
  <line x1="180" y1="90" x2="190" y2="140" stroke="#A93226" stroke-width="1" opacity="0.5"/>

  <!-- Belt loops -->
  <rect x="105" y="78" width="4" height="8" fill="#2C3E50"/>
  <rect x="145" y="78" width="4" height="8" fill="#2C3E50"/>
  <rect x="191" y="78" width="4" height="8" fill="#2C3E50"/>
</svg>
