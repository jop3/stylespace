<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <!-- Waistband -->
  <rect x="90" y="80" width="120" height="15" rx="2" fill="#2E5C8A" stroke="#1F3A5F" stroke-width="2"/>

  <!-- Button -->
  <circle cx="150" cy="87" r="4" fill="#7F8C8D" stroke="#5D6D7E" stroke-width="2"/>

  <!-- Zipper -->
  <line x1="150" y1="95" x2="150" y2="105" stroke="#5D6D7E" stroke-width="3"/>

  <!-- Left leg -->
  <path d="M90 95 L85 150 L110 150 L120 95 Z"
        fill="#4A90E2" stroke="#2E5C8A" stroke-width="3"/>

  <!-- Right leg -->
  <path d="M180 95 L190 150 L215 150 L210 95 Z"
        fill="#4A90E2" stroke="#2E5C8A" stroke-width="3"/>

  <!-- Center seam -->
  <path d="M145 95 L135 150" stroke="#2E5C8A" stroke-width="3"/>
  <path d="M155 95 L165 150" stroke="#2E5C8A" stroke-width="3"/>

  <!-- Stitching -->
  <path d="M92 98 L87 148" stroke="#5BA3F5" stroke-width="2" stroke-dasharray="5,3"/>
  <path d="M118 98 L108 148" stroke="#5BA3F5" stroke-width="2" stroke-dasharray="5,3"/>
  <path d="M182 98 L192 148" stroke="#5BA3F5" stroke-width="2" stroke-dasharray="5,3"/>
  <path d="M208 98 L213 148" stroke="#5BA3F5" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Front pockets -->
  <path d="M105 100 Q110 110 105 120" stroke="#2E5C8A" fill="none" stroke-width="3"/>
  <path d="M195 100 Q190 110 195 120" stroke="#2E5C8A" fill="none" stroke-width="3"/>

  <!-- Back pocket (visible on right side) -->
  <rect x="195" y="105" width="16" height="18" rx="2" fill="#5BA3F5" stroke="#2E5C8A" stroke-width="2"/>
  <path d="M198 110 L208 110" stroke="#5BA3F5" stroke-width="1" stroke-dasharray="2,2"/>
  <path d="M198 118" stroke="#5BA3F5" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Belt loops -->
  <rect x="95" y="78" width="5" height="10" fill="#2E5C8A"/>
  <rect x="125" y="78" width="5" height="10" fill="#2E5C8A"/>
  <rect x="145" y="78" width="5" height="10" fill="#2E5C8A"/>
  <rect x="170" y="78" width="5" height="10" fill="#2E5C8A"/>
  <rect x="200" y="78" width="5" height="10" fill="#2E5C8A"/>

  <!-- Frayed hem -->
  <path d="M85 150 Q87 153 89 150 Q91 147 93 150 Q95 153 97 150 Q99 147 101 150 Q103 153 105 150 Q107 147 110 150"
        stroke="#89C4F4" fill="none" stroke-width="1.5"/>
  <path d="M190 150 Q192 153 194 150 Q196 147 198 150 Q200 153 202 150 Q204 147 206 150 Q208 153 210 150 Q212 147 215 150"
        stroke="#89C4F4" fill="none" stroke-width="1.5"/>

  <!-- Distressed patches -->
  <ellipse cx="100" cy="130" rx="6" ry="4" fill="#89C4F4" opacity="0.5"/>
  <ellipse cx="200" cy="125" rx="5" ry="3" fill="#89C4F4" opacity="0.5"/>
</svg>
