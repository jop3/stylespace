<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Bag body -->
  <rect x="40" y="80" width="120" height="80" rx="5" fill="#2C3E50" stroke="#1A252F" stroke-width="3"/>

  <!-- Flap -->
  <path d="M40 80 L40 55 Q100 45 160 55 L160 80 Z"
        fill="#34495E" stroke="#1A252F" stroke-width="3"/>

  <!-- Buckle straps -->
  <rect x="70" y="65" width="8" height="25" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <rect x="122" y="65" width="8" height="25" fill="#8B4513" stroke="#654321" stroke-width="2"/>

  <!-- Buckles -->
  <rect x="68" y="88" width="12" height="8" rx="1" fill="#DAA520" stroke="#B8860B" stroke-width="2"/>
  <rect x="120" y="88" width="12" height="8" rx="1" fill="#DAA520" stroke="#B8860B" stroke-width="2"/>

  <!-- Front pocket -->
  <rect x="60" y="105" width="80" height="35" rx="3" fill="#1A252F" stroke="#000" stroke-width="2"/>
  <line x1="80" y1="122" x2="120" y2="122" stroke="#34495E" stroke-width="2"/>

  <!-- Shoulder strap -->
  <path d="M35 85 Q20 100 25 120" stroke="#8B4513" fill="none" stroke-width="6" stroke-linecap="round"/>
  <path d="M165 85 Q180 70 175 50" stroke="#8B4513" fill="none" stroke-width="6" stroke-linecap="round"/>

  <!-- Strap adjusters -->
  <rect x="22" y="115" width="10" height="15" fill="#DAA520" stroke="#B8860B" stroke-width="2"/>

  <!-- Stitching -->
  <rect x="42" y="82" width="116" height="76" rx="4" fill="none" stroke="#7F8C8D" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- Logo patch -->
  <rect x="85" y="145" width="30" height="12" rx="2" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  <text x="100" y="154" font-family="Arial" font-size="8" fill="#FFF" text-anchor="middle" font-weight="bold">ADVENTURE</text>
</svg>
