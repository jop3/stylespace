<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250">
  <!-- Hoodie body -->
  <path d="M50 80 L90 60 L120 80 L120 220 L140 220 L140 80 L150 75 L160 80 L160 220 L180 220 L180 80 L210 60 L250 80 L250 220 L50 220 Z"
        fill="#1a1a1a" stroke="#000" stroke-width="3"/>

  <!-- Hood -->
  <path d="M120 80 Q90 55 90 30 Q90 20 100 15 Q130 10 150 10 Q170 10 200 15 Q210 20 210 30 Q210 55 180 80"
        fill="#2a2a2a" stroke="#000" stroke-width="3"/>

  <!-- Hood opening -->
  <ellipse cx="150" cy="50" rx="25" ry="30" fill="#1a1a1a" stroke="#000" stroke-width="2"/>

  <!-- Drawstrings -->
  <circle cx="135" cy="65" r="3" fill="#FFD700"/>
  <circle cx="165" cy="65" r="3" fill="#FFD700"/>
  <path d="M135 65 L125 75" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
  <path d="M165 65 L175 75" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>

  <!-- Zipper -->
  <line x1="150" y1="80" x2="150" y2="220" stroke="#7F8C8D" stroke-width="6"/>
  <rect x="147" y="78" width="6" height="10" fill="#95A5A6" stroke="#7F8C8D" stroke-width="1"/>

  <!-- Zipper teeth -->
  <line x1="147" y1="90" x2="147" y2="215" stroke="#5D6D7E" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="153" y1="90" x2="153" y2="215" stroke="#5D6D7E" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Zipper pull -->
  <circle cx="150" cy="85" r="5" fill="#BDC3C7" stroke="#95A5A6" stroke-width="2"/>

  <!-- Side pockets -->
  <path d="M125 140 Q130 145 125 150" stroke="#000" fill="none" stroke-width="3"/>
  <path d="M175 140 Q170 145 175 150" stroke="#000" fill="none" stroke-width="3"/>

  <!-- Ribbing at bottom -->
  <rect x="50" y="215" width="200" height="5" fill="#000"/>

  <!-- Ribbing at sleeves -->
  <ellipse cx="90" cy="62" rx="8" ry="15" fill="#000"/>
  <ellipse cx="210" cy="62" rx="8" ry="15" fill="#000"/>
</svg>
