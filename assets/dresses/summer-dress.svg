<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280">
  <!-- Dress body (A-line) -->
  <path d="M120 80 L95 60 L90 80 L70 200 L230 200 L210 80 L205 60 L180 80 Z"
