  <circle cx="150" cy="115" r="4" fill="#FF1493"/>
  <path d="M150 115 L148 122 L152 122 Z" fill="#FF1493"/>

  <!-- Floral pattern -->
  <circle cx="100" cy="140" r="5" fill="#FFF" opacity="0.7"/>
  <circle cx="97" cy="138" r="3" fill="#FFD700" opacity="0.8"/>
  <circle cx="103" cy="138" r="3" fill="#FFD700" opacity="0.8"/>
  <circle cx="97" cy="142" r="3" fill="#FFD700" opacity="0.8"/>
  <circle cx="103" cy="142" r="3" fill="#FFD700" opacity="0.8"/>

  <circle cx="180" cy="150" r="5" fill="#FFF" opacity="0.7"/>
  <circle cx="177" cy="148" r="3" fill="#FFD700" opacity="0.8"/>
  <circle cx="183" cy="148" r="3" fill="#FFD700" opacity="0.8"/>
  <circle cx="177" cy="152" r="3" fill="#FFD700" opacity="0.8"/>
  <circle cx="183" cy="152" r="3" fill="#FFD700" opacity="0.8"/>

  <circle cx="130" cy="170" r="5" fill="#FFF" opacity="0.7"/>
  <circle cx="127" cy="168" r="3" fill="#FFD700" opacity="0.8"/>
  <circle cx="133" cy="168" r="3" fill="#FFD700" opacity="0.8"/>
  <circle cx="127" cy="172" r="3" fill="#FFD700" opacity="0.8"/>
