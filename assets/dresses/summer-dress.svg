  <!-- Waistband -->
  <ellipse cx="150" cy="115" rx="55" ry="8" fill="#FF1493" stroke="#C71585" stroke-width="2"/>

  <!-- Bow at waist -->
  <ellipse cx="140" cy="115" rx="8" ry="6" fill="#FF69B4"/>
