<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280">
  <!-- Dress body -->
  <path d="M120 90 L95 70 L90 90 L85 180 L215 180 L210 90 L205 70 L180 90 Z"
        fill="#000" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Sweetheart neckline -->
  <path d="M120 90 Q135 100 150 95 Q165 100 180 90"
        stroke="#1a1a1a" fill="none" stroke-width="3"/>

  <!-- Straps (thin) -->
  <line x1="120" y1="90" x2="115" y2="60" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <line x1="180" y1="90" x2="185" y2="60" stroke="#000" stroke-width="4" stroke-linecap="round"/>

  <!-- Metallic belt -->
  <rect x="90" y="125" width="120" height="10" fill="#FFD700" stroke="#DAA520" stroke-width="2"/>
  <rect x="145" y="123" width="10" height="14" fill="#DAA520" stroke="#B8860B" stroke-width="2"/>

  <!-- Sequin details -->
  <circle cx="110" cy="105" r="2" fill="#C0C0C0"/>
  <circle cx="125" cy="110" r="2" fill="#C0C0C0"/>
  <circle cx="140" cy="108" r="2" fill="#C0C0C0"/>
  <circle cx="155" cy="112" r="2" fill="#C0C0C0"/>
  <circle cx="170" cy="107" r="2" fill="#C0C0C0"/>
  <circle cx="185" cy="110" r="2" fill="#C0C0C0"/>

  <circle cx="100" cy="145" r="2" fill="#C0C0C0"/>
  <circle cx="115" cy="150" r="2" fill="#C0C0C0"/>
  <circle cx="130" cy="148" r="2" fill="#C0C0C0"/>
  <circle cx="145" cy="152" r="2" fill="#C0C0C0"/>
  <circle cx="160" cy="147" r="2" fill="#C0C0C0"/>
  <circle cx="175" cy="151" r="2" fill="#C0C0C0"/>
  <circle cx="190" cy="146" r="2" fill="#C0C0C0"/>

  <circle cx="95" cy="165" r="2" fill="#C0C0C0"/>
  <circle cx="110" cy="168" r="2" fill="#C0C0C0"/>
  <circle cx="125" cy="166" r="2" fill="#C0C0C0"/>
  <circle cx="140" cy="170" r="2" fill="#C0C0C0"/>
  <circle cx="155" cy="167" r="2" fill="#C0C0C0"/>
  <circle cx="170" cy="171" r="2" fill="#C0C0C0"/>
  <circle cx="185" cy="165" r="2" fill="#C0C0C0"/>
  <circle cx="200" cy="169" r="2" fill="#C0C0C0"/>

  <!-- Asymmetric hem -->
  <path d="M85 180 L100 185 L120 178 L140 182 L160 175 L180 180 L200 177 L215 180"
        fill="#1a1a1a" stroke="#000" stroke-width="2"/>

  <!-- Shimmer highlights -->
  <path d="M130 100 Q135 115 140 100" stroke="#333" fill="none" stroke-width="1" opacity="0.5"/>
  <path d="M160 105 Q165 120 170 105" stroke="#333" fill="none" stroke-width="1" opacity="0.5"/>
</svg>
