<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Dragon T-shirt Design -->
  <g transform="translate(150, 100)">
    <!-- Dragon body -->
    <ellipse cx="0" cy="0" rx="50" ry="35" fill="#DC143C"/>
    <!-- Dragon head -->
    <circle cx="-20" cy="-25" r="25" fill="#DC143C"/>
    <!-- Eyes -->
    <circle cx="-25" cy="-30" r="5" fill="#FFD700"/>
    <circle cx="-15" cy="-30" r="5" fill="#FFD700"/>
    <!-- Pupils -->
    <circle cx="-25" cy="-30" r="2" fill="#000"/>
    <circle cx="-15" cy="-30" r="2" fill="#000"/>
    <!-- Horns -->
    <polygon points="-30,-45 -35,-55 -25,-50" fill="#8B0000"/>
    <polygon points="-10,-45 -5,-55 -15,-50" fill="#8B0000"/>
    <!-- Wings -->
    <path d="M -40,0 Q -80,-20 -70,10 Z" fill="#FF6347" opacity="0.8"/>
    <path d="M 40,0 Q 80,-20 70,10 Z" fill="#FF6347" opacity="0.8"/>
    <!-- Fire breath -->
    <path d="M -40,-20 Q -60,-25 -70,-15" stroke="#FFA500" stroke-width="3" fill="none"/>
    <path d="M -40,-18 Q -65,-20 -75,-10" stroke="#FF4500" stroke-width="2" fill="none"/>
    <!-- Tail -->
    <path d="M 40,15 Q 60,20 65,10 L 70,15" stroke="#DC143C" stroke-width="8" fill="none"/>
  </g>
</svg>
