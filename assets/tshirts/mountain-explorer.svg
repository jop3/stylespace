<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <!-- T-shirt base -->
  <path d="M50 50 L90 30 L120 50 L120 180 L180 180 L180 50 L210 30 L250 50 L250 180 L50 180 Z" fill="#F0F8FF" stroke="#E6F2FF" stroke-width="2"/>

  <!-- Mountains -->
  <polygon points="130,120 150,80 170,120" fill="#4682B4" stroke="#2F4F4F" stroke-width="2"/>
  <polygon points="115,130 135,95 155,130" fill="#5F9EA0" stroke="#2F4F4F" stroke-width="2"/>
  <polygon points="165,130 180,100 195,130" fill="#5F9EA0" stroke="#2F4F4F" stroke-width="2"/>

  <!-- Snow caps -->
  <polygon points="145,85 150,80 155,85" fill="#FFF"/>
  <polygon points="130,100 135,95 140,100" fill="#FFF"/>
  <polygon points="175,105 180,100 185,105" fill="#FFF"/>

  <!-- Sun -->
  <circle cx="175" cy="70" r="8" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>

  <!-- Birds -->
  <path d="M120 65 Q123 63 126 65" stroke="#2F4F4F" fill="none" stroke-width="1.5"/>
  <path d="M127 67 Q130 65 133 67" stroke="#2F4F4F" fill="none" stroke-width="1.5"/>

  <!-- Trees -->
  <polygon points="140,115 143,105 146,115" fill="#228B22"/>
  <rect x="142" y="115" width="2" height="5" fill="#8B4513"/>

  <polygon points="160,118 163,108 166,118" fill="#228B22"/>
  <rect x="162" y="118" width="2" height="5" fill="#8B4513"/>

  <text x="150" y="155" font-family="Arial Black" font-size="11" fill="#4682B4" text-anchor="middle" font-weight="bold">MOUNTAIN</text>
  <text x="150" y="170" font-family="Arial Black" font-size="11" fill="#2F4F4F" text-anchor="middle" font-weight="bold">EXPLORER</text>
</svg>
