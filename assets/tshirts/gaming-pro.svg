<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <!-- T-shirt base -->
  <path d="M50 50 L90 30 L120 50 L120 180 L180 180 L180 50 L210 30 L250 50 L250 180 L50 180 Z" fill="#1a1a2e" stroke="#16213e" stroke-width="2"/>

  <!-- Game controller -->
  <rect x="115" y="85" width="70" height="40" rx="10" fill="#0f3460" stroke="#e94560" stroke-width="2"/>

  <!-- D-pad -->
  <rect x="128" y="100" width="6" height="12" fill="#e94560"/>
  <rect x="125" y="103" width="12" height="6" fill="#e94560"/>

  <!-- Buttons -->
  <circle cx="170" cy="103" r="4" fill="#00ff88"/>
  <circle cx="163" cy="108" r="4" fill="#ff6b6b"/>
  <circle cx="177" cy="108" r="4" fill="#ffd93d"/>
  <circle cx="170" cy="113" r="4" fill="#4ecdc4"/>

  <!-- Pixel heart -->
  <g transform="translate(135, 135)">
    <rect x="0" y="4" width="4" height="4" fill="#e94560"/>
    <rect x="8" y="4" width="4" height="4" fill="#e94560"/>
    <rect x="0" y="8" width="12" height="4" fill="#e94560"/>
    <rect x="0" y="12" width="12" height="4" fill="#e94560"/>
    <rect x="4" y="16" width="4" height="4" fill="#e94560"/>
  </g>

  <!-- Text "PRO GAMER" -->
  <text x="150" y="170" font-family="Arial Black" font-size="12" fill="#00ff88" text-anchor="middle" font-weight="bold">PRO GAMER</text>
</svg>