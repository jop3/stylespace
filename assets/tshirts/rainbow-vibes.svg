<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <!-- T-shirt base -->
  <path d="M50 50 L90 30 L120 50 L120 180 L180 180 L180 50 L210 30 L250 50 L250 180 L50 180 Z" fill="#fff" stroke="#ddd" stroke-width="2"/>

  <!-- Rainbow -->
  <path d="M110 120 Q150 80 190 120" stroke="#e74c3c" fill="none" stroke-width="6" stroke-linecap="round"/>
  <path d="M112 125 Q150 87 188 125" stroke="#f39c12" fill="none" stroke-width="6" stroke-linecap="round"/>
  <path d="M114 130 Q150 94 186 130" stroke="#f1c40f" fill="none" stroke-width="6" stroke-linecap="round"/>
  <path d="M116 135 Q150 101 184 135" stroke="#2ecc71" fill="none" stroke-width="6" stroke-linecap="round"/>
  <path d="M118 140 Q150 108 182 140" stroke="#3498db" fill="none" stroke-width="6" stroke-linecap="round"/>
  <path d="M120 145 Q150 115 180 145" stroke="#9b59b6" fill="none" stroke-width="6" stroke-linecap="round"/>

  <!-- Clouds -->
