<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <path d="M50 50 L90 30 L120 50 L120 180 L180 180 L180 50 L210 30 L250 50 L250 180 L50 180 Z" fill="#fff" stroke="#f0f0f0" stroke-width="2"/>
  
  <!-- Panda face -->
  <circle cx="150" cy="105" r="30" fill="#fff" stroke="#000" stroke-width="2"/>
  
  <!-- Ears -->
  <circle cx="130" cy="85" r="10" fill="#1a1a1a"/>
  <circle cx="170" cy="85" r="10" fill="#1a1a1a"/>
  
  <!-- Eye patches -->
  <ellipse cx="140" cy="100" rx="8" ry="11" fill="#1a1a1a"/>
  <ellipse cx="160" cy="100" rx="8" ry="11" fill="#1a1a1a"/>
  
  <!-- Eyes -->
  <circle cx="140" cy="100" r="4" fill="#fff"/>
  <circle cx="160" cy="100" r="4" fill="#fff"/>
  <circle cx="141" cy="99" r="2" fill="#000"/>
  <circle cx="161" cy="99" r="2" fill="#000"/>
  
  <!-- Nose and mouth -->
  <ellipse cx="150" cy="110" rx="4" ry="3" fill="#000"/>
  <path d="M150 110 Q145 115 140 113" stroke="#000" fill="none" stroke-width="2"/>
  <path d="M150 110 Q155 115 160 113" stroke="#000" fill="none" stroke-width="2"/>
  
  <!-- Bamboo -->
  <rect x="125" y="130" width="6" height="25" fill="#2ecc71" stroke="#27ae60" stroke-width="1"/>
  <rect x="169" y="130" width="6" height="25" fill="#2ecc71" stroke="#27ae60" stroke-width="1"/>
  
  <text x="150" y="170" font-family="Arial Black" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">STAY WILD</text>
</svg>
