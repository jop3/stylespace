<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <!-- T-shirt base -->
  <path d="M50 50 L90 30 L120 50 L120 180 L180 180 L180 50 L210 30 L250 50 L250 180 L50 180 Z" fill="#2C3E50" stroke="#1A252F" stroke-width="2"/>

  <!-- Skateboard deck -->
  <rect x="125" y="100" width="50" height="15" rx="7" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>

  <!-- Deck design -->
  <line x1="135" y1="105" x2="165" y2="105" stroke="#FFF" stroke-width="1" opacity="0.3"/>
  <line x1="135" y1="110" x2="165" y2="110" stroke="#FFF" stroke-width="1" opacity="0.3"/>

  <!-- Trucks -->
  <rect x="128" y="113" width="8" height="4" fill="#95A5A6"/>
  <rect x="164" y="113" width="8" height="4" fill="#95A5A6"/>

  <!-- Wheels -->
  <circle cx="132" cy="119" r="4" fill="#34495E" stroke="#2C3E50" stroke-width="1"/>
  <circle cx="168" cy="119" r="4" fill="#34495E" stroke="#2C3E50" stroke-width="1"/>

  <!-- Motion lines -->
  <line x1="115" y1="95" x2="125" y2="98" stroke="#3498DB" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="110" y1="105" x2="120" y2="107" stroke="#3498DB" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="115" y1="115" x2="125" y2="117" stroke="#3498DB" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Stars (for tricks) -->
  <path d="M180 95 L182 100 L187 100 L183 103 L185 108 L180 105 L175 108 L177 103 L173 100 L178 100 Z"
        fill="#F39C12" opacity="0.7"/>

  <text x="150" y="145" font-family="Arial Black" font-size="12" fill="#E74C3C" text-anchor="middle" font-weight="bold">SKATE</text>
  <text x="150" y="160" font-family="Arial" font-size="10" fill="#ECF0F1" text-anchor="middle">OR DIE</text>
</svg>
