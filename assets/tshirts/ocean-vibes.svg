  <!-- Waves -->
  <path d="M115 100 Q125 95 135 100 Q145 105 155 100 Q165 95 175 100 Q185 105 195 100"
        stroke="#00BCD4" fill="none" stroke-width="3" stroke-linecap="round"/>
  <path d="M115 110 Q125 105 135 110 Q145 115 155 110 Q165 105 175 110 Q185 115 195 110"
