  <line x1="150" y1="85" x2="150" y2="100" stroke="#FFD54F" stroke-width="2" opacity="0.4"/>
  <line x1="145" y1="88" x2="148" y2="98" stroke="#FFD54F" stroke-width="1.5" opacity="0.3"/>
  <line x1="155" y1="88" x2="152" y2="98" stroke="#FFD54F" stroke-width="1.5" opacity="0.3"/>

  <!-- Seagull -->
  <path d="M130 75 Q133 73 136 75" stroke="#546E7A" fill="none" stroke-width="1.5"/>

  <!-- Dolphin -->
