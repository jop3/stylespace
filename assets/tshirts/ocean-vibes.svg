  <text x="150" y="155" font-family="Arial Black" font-size="12" fill="#00BCD4" text-anchor="middle" font-weight="bold">OCEAN</text>
  <text x="150" y="170" font-family="Arial Black" font-size="12" fill="#0097A7" text-anchor="middle" font-weight="bold">VIBES</text>
</svg>
