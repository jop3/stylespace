<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <!-- T-shirt base -->
  <path d="M50 50 L90 30 L120 50 L120 180 L180 180 L180 50 L210 30 L250 50 L250 180 L50 180 Z" fill="#0a0e27" stroke="#1a1f4d" stroke-width="2"/>

  <!-- Rocket -->
  <polygon points="150,70 160,100 140,100" fill="#e74c3c"/>
  <rect x="145" y="100" width="10" height="30" fill="#ecf0f1"/>
  <polygon points="145,130 140,145 145,145" fill="#c0392b"/>
  <polygon points="155,130 160,145 155,145" fill="#c0392b"/>

  <!-- Fire -->
  <polygon points="147,130 150,140 153,130" fill="#f39c12"/>
  <polygon points="148,135 150,143 152,135" fill="#e74c3c"/>

  <!-- Stars -->
  <circle cx="120" cy="80" r="2" fill="#fff"/>
  <circle cx="180" cy="85" r="1.5" fill="#fff"/>
  <circle cx="130" cy="115" r="1" fill="#fff"/>
  <circle cx="170" cy="110" r="2" fill="#fff"/>
  <circle cx="160" cy="70" r="1" fill="#fff"/>
  <circle cx="125" cy="95" r="1.5" fill="#fff"/>
  <circle cx="175" cy="95" r="1" fill="#fff"/>

  <!-- Planets -->
  <circle cx="135" cy="130" r="8" fill="#e67e22" opacity="0.8"/>
  <ellipse cx="135" cy="130" rx="12" ry="2" fill="none" stroke="#d35400" stroke-width="1" opacity="0.6"/>

  <circle cx="170" cy="125" r="6" fill="#3498db" opacity="0.7"/>

  <!-- Text -->
  <text x="150" y="168" font-family="Arial" font-size="10" fill="#3498db" text-anchor="middle">SPACE</text>
  <text x="150" y="180" font-family="Arial Black" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">EXPLORER</text>
</svg>