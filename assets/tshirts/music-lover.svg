<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <!-- T-shirt base -->
  <path d="M50 50 L90 30 L120 50 L120 180 L180 180 L180 50 L210 30 L250 50 L250 180 L50 180 Z" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>

  <!-- Headphones -->
  <path d="M120 90 Q150 60 180 90" stroke="#fff" fill="none" stroke-width="4" stroke-linecap="round"/>
  <rect x="115" y="88" width="12" height="20" rx="6" fill="#fff"/>
  <rect x="173" y="88" width="12" height="20" rx="6" fill="#fff"/>
  <rect x="118" y="91" width="6" height="14" fill="#e74c3c"/>
  <rect x="176" y="91" width="6" height="14" fill="#e74c3c"/>

  <!-- Musical notes -->
  <g fill="#f1c40f">
    <circle cx="140" cy="120" r="4"/>
    <rect x="144" y="100" width="2" height="20"/>
    <circle cx="160" cy="125" r="4"/>
    <rect x="164" y="105" width="2" height="20"/>
  </g>

  <!-- Sound waves -->
  <g stroke="#fff" fill="none" stroke-width="2" opacity="0.7">
    <path d="M190 95 Q195 100 190 105"/>
    <path d="M195 92 Q202 100 195 108"/>
    <path d="M110 95 Q105 100 110 105"/>
    <path d="M105 92 Q98 100 105 108"/>
  </g>

  <!-- Text -->
  <text x="150" y="155" font-family="Arial" font-size="10" fill="#f1c40f" text-anchor="middle">MUSIC IS</text>
  <text x="150" y="170" font-family="Arial Black" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">LIFE</text>
</svg>