<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <!-- T-shirt base -->
  <path d="M50 50 L90 30 L120 50 L120 180 L180 180 L180 50 L210 30 L250 50 L250 180 L50 180 Z" fill="#FFF5E1" stroke="#FFEFD5" stroke-width="2"/>

  <!-- Taco shell -->
  <path d="M125 110 Q135 85 150 80 Q165 85 175 110 Q172 120 168 125 L132 125 Q128 120 125 110"
        fill="#F4A460" stroke="#D2691E" stroke-width="2"/>

  <!-- Lettuce -->
  <path d="M135 105 Q140 100 145 105 Q150 100 155 105 Q160 100 165 105"
        fill="#90EE90" stroke="#2ecc71" stroke-width="1"/>

  <!-- Cheese -->
  <path d="M137 110 L148 110 L145 118 L140 118 Z" fill="#FFD700"/>
  <path d="M152 110 L163 110 L160 118 L155 118 Z" fill="#FFD700"/>

  <!-- Tomato -->
  <circle cx="143" cy="113" r="3" fill="#FF6347"/>
  <circle cx="157" cy="113" r="3" fill="#FF6347"/>

  <!-- Meat -->
  <ellipse cx="150" cy="118" rx="15" ry="5" fill="#8B4513"/>

  <!-- Sour cream -->
  <path d="M140 108 Q145 106 150 108 Q155 106 160 108"
        stroke="#FFF" fill="none" stroke-width="3" stroke-linecap="round"/>

  <text x="150" y="150" font-family="Arial Black" font-size="13" fill="#F4A460" text-anchor="middle" font-weight="bold">TACO</text>
  <text x="150" y="165" font-family="Arial Black" font-size="13" fill="#D2691E" text-anchor="middle" font-weight="bold">TUESDAY</text>
</svg>
