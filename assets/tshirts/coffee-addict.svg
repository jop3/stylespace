  <!-- Coffee cup -->
  <rect x="125" y="90" width="50" height="50" rx="5" fill="#FFFACD" stroke="#8B4513" stroke-width="2"/>
  <ellipse cx="150" cy="90" rx="25" ry="8" fill="#FFF8DC" stroke="#8B4513" stroke-width="2"/>

  <!-- Coffee inside -->
  <ellipse cx="150" cy="95" rx="20" ry="6" fill="#3E2723"/>
  <rect x="130" y="95" width="40" height="40" fill="#3E2723"/>

  <!-- Steam -->
  <path d="M135 75 Q132 65 135 55" stroke="#FFF" fill="none" stroke-width="2" opacity="0.7"/>
  <path d="M145 78 Q142 68 145 58" stroke="#FFF" fill="none" stroke-width="2" opacity="0.7"/>
  <path d="M155 78 Q158 68 155 58" stroke="#FFF" fill="none" stroke-width="2" opacity="0.7"/>
  <path d="M165 75 Q168 65 165 55" stroke="#FFF" fill="none" stroke-width="2" opacity="0.7"/>

  <!-- Handle -->
  <path d="M175 105 Q190 105 190 115 Q190 125 175 125" stroke="#8B4513" fill="none" stroke-width="3"/>

  <!-- Heart in coffee -->
  <path d="M145 110 Q142 107 139 110 Q139 116 145 122 Q151 116 151 110 Q148 107 145 110 Z" fill="#FFE4E1"/>

  <!-- Text -->
  <text x="150" y="165" font-family="Arial" font-size="11" fill="#FFFACD" text-anchor="middle" font-weight="bold">BUT FIRST</text>
  <text x="150" y="178" font-family="Arial Black" font-size="13" fill="#FFFACD" text-anchor="middle" font-weight="bold">COFFEE</text>
</svg>