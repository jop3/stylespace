<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Unicorn T-shirt Design -->
  <g transform="translate(150, 100)">
    <!-- Unicorn head -->
    <circle cx="0" cy="0" r="40" fill="#FFB6C1"/>
    <!-- Horn -->
    <polygon points="0,-40 -8,-60 8,-60" fill="#FFD700"/>
    <!-- Eyes -->
    <circle cx="-15" cy="-5" r="5" fill="#000"/>
    <circle cx="15" cy="-5" r="5" fill="#000"/>
    <!-- Mane -->
    <path d="M -35,-10 Q -50,0 -35,20" fill="#FF69B4" opacity="0.7"/>
    <path d="M 35,-10 Q 50,0 35,20" fill="#9370DB" opacity="0.7"/>
    <!-- Smile -->
    <path d="M -15,10 Q 0,15 15,10" stroke="#000" stroke-width="2" fill="none"/>
    <!-- Stars around -->
    <text x="-60" y="-30" font-size="20" fill="#FFD700">★</text>
    <text x="50" y="-30" font-size="20" fill="#FFD700">★</text>
    <text x="-50" y="40" font-size="15" fill="#FFD700">★</text>
    <text x="40" y="40" font-size="15" fill="#FFD700">★</text>
  </g>
</svg>
