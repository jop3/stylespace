<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150">
  <!-- Ring band -->
  <ellipse cx="75" cy="90" rx="40" ry="45" fill="none" stroke="#FFD700" stroke-width="10"/>
  <ellipse cx="75" cy="90" rx="40" ry="45" fill="none" stroke="#DAA520" stroke-width="4"/>

  <!-- Band highlight -->
  <path d="M40 70 Q50 65 60 70" stroke="#FFF" fill="none" stroke-width="2" opacity="0.6"/>

  <!-- Diamond setting -->
  <ellipse cx="75" cy="40" rx="12" ry="8" fill="#DAA520" stroke="#B8860B" stroke-width="2"/>

  <!-- Diamond -->
  <polygon points="75,20 85,35 75,45 65,35" fill="#E3F2FD" stroke="#BBDEFB" stroke-width="2"/>

  <!-- Diamond facets -->
  <line x1="75" y1="20" x2="75" y2="45" stroke="#90CAF9" stroke-width="1"/>
  <line x1="65" y1="35" x2="85" y2="35" stroke="#90CAF9" stroke-width="1"/>
  <line x1="70" y1="27" x2="80" y2="40" stroke="#90CAF9" stroke-width="0.5"/>
  <line x1="80" y1="27" x2="70" y2="40" stroke="#90CAF9" stroke-width="0.5"/>

  <!-- Diamond sparkles -->
  <circle cx="78" cy="23" r="1" fill="#FFF"/>
  <line x1="82" y1="30" x2="88" y2="30" stroke="#FFF" stroke-width="1" opacity="0.8"/>
  <line x1="85" y1="27" x2="85" y2="33" stroke="#FFF" stroke-width="1" opacity="0.8"/>

  <!-- Prongs -->
  <line x1="65" y1="35" x2="63" y2="38" stroke="#B8860B" stroke-width="2"/>
  <line x1="85" y1="35" x2="87" y2="38" stroke="#B8860B" stroke-width="2"/>
</svg>
