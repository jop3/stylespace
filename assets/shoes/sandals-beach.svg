  <path d="M45 95 Q60 90 75 95" stroke="#D2691E" fill="none" stroke-width="6" stroke-linecap="round"/>
  <path d="M50 100 Q60 98 70 100" stroke="#D2691E" fill="none" stroke-width="6" stroke-linecap="round"/>
