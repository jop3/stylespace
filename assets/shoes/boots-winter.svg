<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <!-- Left boot -->
  <path d="M40 120 L40 60 Q40 45 50 45 L65 45 L65 115 Q65 120 60 120 Z"
        fill="#8B4513" stroke="#654321" stroke-width="2"/>

  <!-- Left boot sole -->
  <ellipse cx="52" cy="120" rx="15" ry="6" fill="#1a1a1a" stroke="#000" stroke-width="2"/>

  <!-- Left boot fur trim -->
  <path d="M40 60 Q45 58 50 60 Q55 58 60 60 Q65 58 65 60"
        stroke="#FFF" fill="none" stroke-width="5" stroke-linecap="round"/>

  <!-- Left boot laces -->
  <line x1="48" y1="70" x2="56" y2="70" stroke="#654321" stroke-width="1.5"/>
  <line x1="48" y1="80" x2="56" y2="80" stroke="#654321" stroke-width="1.5"/>
  <line x1="48" y1="90" x2="56" y2="90" stroke="#654321" stroke-width="1.5"/>
  <line x1="48" y1="100" x2="56" y2="100" stroke="#654321" stroke-width="1.5"/>

  <!-- Right boot -->
  <path d="M135 120 L135 60 Q135 45 145 45 L160 45 L160 115 Q160 120 155 120 Z"
        fill="#8B4513" stroke="#654321" stroke-width="2"/>

  <!-- Right boot sole -->
  <ellipse cx="147" cy="120" rx="15" ry="6" fill="#1a1a1a" stroke="#000" stroke-width="2"/>

  <!-- Right boot fur trim -->
  <path d="M135 60 Q140 58 145 60 Q150 58 155 60 Q160 58 160 60"
        stroke="#FFF" fill="none" stroke-width="5" stroke-linecap="round"/>

  <!-- Right boot laces -->
  <line x1="143" y1="70" x2="151" y2="70" stroke="#654321" stroke-width="1.5"/>
  <line x1="143" y1="80" x2="151" y2="80" stroke="#654321" stroke-width="1.5"/>
  <line x1="143" y1="90" x2="151" y2="90" stroke="#654321" stroke-width="1.5"/>
  <line x1="143" y1="100" x2="151" y2="100" stroke="#654321" stroke-width="1.5"/>
</svg>
