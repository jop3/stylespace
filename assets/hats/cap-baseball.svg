<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <!-- Bill/visor -->
  <ellipse cx="100" cy="90" rx="50" ry="15" fill="#1E3A8A" stroke="#1E40AF" stroke-width="2"/>

  <!-- Cap crown -->
  <ellipse cx="100" cy="70" rx="45" ry="35" fill="#2563EB" stroke="#1E40AF" stroke-width="2"/>

  <!-- Front panel -->
  <path d="M70 65 Q100 50 130 65 L130 85 Q100 80 70 85 Z"
        fill="#3B82F6" stroke="#1E40AF" stroke-width="2"/>

  <!-- Seams -->
  <line x1="100" y1="50" x2="100" y2="85" stroke="#1E40AF" stroke-width="2"/>
  <path d="M85 55 Q90 50 100 50" stroke="#1E40AF" fill="none" stroke-width="1.5"/>
  <path d="M115 55 Q110 50 100 50" stroke="#1E40AF" fill="none" stroke-width="1.5"/>

  <!-- Button on top -->
  <circle cx="100" cy="50" r="4" fill="#1E40AF" stroke="#1E3A8A" stroke-width="2"/>

  <!-- Logo area (letter) -->
  <text x="100" y="75" font-family="Arial Black" font-size="18" fill="#FFF" text-anchor="middle" font-weight="bold">S</text>

  <!-- Adjustment strap -->
  <rect x="130" y="78" width="15" height="8" rx="2" fill="#1E40AF" stroke="#1E3A8A" stroke-width="1"/>
  <circle cx="137" cy="82" r="2" fill="#FFF"/>

  <!-- Ventilation holes -->
  <circle cx="85" cy="65" r="1.5" fill="#1E40AF"/>
  <circle cx="115" cy="65" r="1.5" fill="#1E40AF"/>
</svg>
