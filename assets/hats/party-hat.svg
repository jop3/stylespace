<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <!-- Hat cone -->
  <path d="M100 20 L140 110 L60 110 Z" fill="#FF1493" stroke="#C71585" stroke-width="2"/>

  <!-- Stripes -->
  <polygon points="100,20 110,50 90,50" fill="#FFD700"/>
  <polygon points="95,60 105,60 110,80 90,80" fill="#00CED1"/>
  <polygon points="92,90 108,90 113,110 87,110" fill="#9370DB"/>

  <!-- Pom pom on top -->
  <circle cx="100" cy="20" r="8" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
  <circle cx="95" cy="16" r="3" fill="#FFF" opacity="0.7"/>
  <circle cx="103" cy="18" r="3" fill="#FFF" opacity="0.7"/>
  <circle cx="100" cy="25" r="3" fill="#FFF" opacity="0.7"/>

  <!-- Polka dots -->
  <circle cx="95" cy="40" r="3" fill="#FFF"/>
  <circle cx="105" cy="45" r="3" fill="#FFF"/>
  <circle cx="92" cy="70" r="3" fill="#FFF"/>
  <circle cx="108" cy="72" r="3" fill="#FFF"/>
  <circle cx="90" cy="95" r="3" fill="#FFF"/>
  <circle cx="110" cy="100" r="3" fill="#FFF"/>

  <!-- Elastic string -->
  <path d="M60 110 Q50 120 55 130" stroke="#FFD700" fill="none" stroke-width="2"/>
  <path d="M140 110 Q150 120 145 130" stroke="#FFD700" fill="none" stroke-width="2"/>

  <!-- Sparkles -->
  <path d="M110 35 L112 37 L114 35 L112 33 Z" fill="#FFF"/>
  <path d="M88 65 L90 67 L92 65 L90 63 Z" fill="#FFF"/>
</svg>
