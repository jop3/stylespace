<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250">
  <!-- Jacket body -->
  <path d="M50 90 L90 70 L115 90 L115 200 L140 200 L140 90 L150 85 L160 90 L160 200 L185 200 L185 90 L210 70 L250 90 L250 200 L50 200 Z"
        fill="#4A90E2" stroke="#2E5C8A" stroke-width="3"/>

  <!-- Collar -->
  <path d="M115 90 L125 70 L138 88" fill="#5BA3F5" stroke="#2E5C8A" stroke-width="2"/>
  <path d="M185 90 L175 70 L162 88" fill="#5BA3F5" stroke="#2E5C8A" stroke-width="2"/>

  <!-- Button placket -->
  <rect x="145" y="90" width="10" height="110" fill="#2E5C8A"/>

  <!-- Buttons -->
  <circle cx="150" cy="100" r="4" fill="#7F8C8D" stroke="#5D6D7E" stroke-width="2"/>
  <circle cx="150" cy="120" r="4" fill="#7F8C8D" stroke="#5D6D7E" stroke-width="2"/>
  <circle cx="150" cy="140" r="4" fill="#7F8C8D" stroke="#5D6D7E" stroke-width="2"/>
  <circle cx="150" cy="160" r="4" fill="#7F8C8D" stroke="#5D6D7E" stroke-width="2"/>
  <circle cx="150" cy="180" r="4" fill="#7F8C8D" stroke="#5D6D7E" stroke-width="2"/>

  <!-- Thread on buttons -->
  <line x1="148" y1="100" x2="152" y2="100" stroke="#34495E" stroke-width="1"/>
  <line x1="148" y1="120" x2="152" y2="120" stroke="#34495E" stroke-width="1"/>
  <line x1="148" y1="140" x2="152" y2="140" stroke="#34495E" stroke-width="1"/>
  <line x1="148" y1="160" x2="152" y2="160" stroke="#34495E" stroke-width="1"/>
  <line x1="148" y1="180" x2="152" y2="180" stroke="#34495E" stroke-width="1"/>

  <!-- Chest pockets with flaps -->
  <rect x="100" y="110" width="30" height="25" rx="2" fill="#5BA3F5" stroke="#2E5C8A" stroke-width="2"/>
  <rect x="170" y="110" width="30" height="25" rx="2" fill="#5BA3F5" stroke="#2E5C8A" stroke-width="2"/>
  <circle cx="115" cy="122" r="2" fill="#7F8C8D"/>
  <circle cx="185" cy="122" r="2" fill="#7F8C8D"/>

  <!-- Stitching details -->
  <path d="M115 90 L115 200" stroke="#5BA3F5" stroke-width="2" stroke-dasharray="5,3"/>
  <path d="M185 90 L185 200" stroke="#5BA3F5" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Side seams -->
  <line x1="50" y1="100" x2="50" y2="195" stroke="#2E5C8A" stroke-width="3"/>
  <line x1="250" y1="100" x2="250" y2="195" stroke="#2E5C8A" stroke-width="3"/>

  <!-- Worn patches (distressed look) -->
  <ellipse cx="125" cy="155" rx="8" ry="5" fill="#89C4F4" opacity="0.6"/>
  <ellipse cx="175" cy="145" rx="6" ry="4" fill="#89C4F4" opacity="0.6"/>
</svg>
