<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250">
  <!-- Jacket body -->
  <path d="M50 90 L90 70 L115 90 L115 200 L140 200 L140 90 L150 85 L160 90 L160 200 L185 200 L185 90 L210 70 L250 90 L250 200 L50 200 Z"
        fill="#1a1a1a" stroke="#000" stroke-width="3"/>

  <!-- Collar (lapels) -->
  <path d="M115 90 L130 75 L140 90" fill="#2a2a2a" stroke="#000" stroke-width="2"/>
  <path d="M185 90 L170 75 L160 90" fill="#2a2a2a" stroke="#000" stroke-width="2"/>

  <!-- Zipper -->
  <line x1="150" y1="90" x2="150" y2="200" stroke="#7F8C8D" stroke-width="6"/>
  <rect x="147" y="88" width="6" height="12" fill="#95A5A6" stroke="#7F8C8D" stroke-width="1"/>

  <!-- Zipper pull -->
  <circle cx="150" cy="95" r="5" fill="#BDC3C7" stroke="#95A5A6" stroke-width="2"/>

  <!-- Chest pockets -->
  <rect x="105" y="110" width="25" height="20" fill="#0a0a0a" stroke="#000" stroke-width="2"/>
  <rect x="170" y="110" width="25" height="20" fill="#0a0a0a" stroke="#000" stroke-width="2"/>
  <line x1="110" y1="120" x2="125" y2="120" stroke="#7F8C8D" stroke-width="1"/>
  <line x1="175" y1="120" x2="190" y2="120" stroke="#7F8C8D" stroke-width="1"/>

  <!-- Side pockets -->
  <path d="M115 155 Q120 160 115 165" stroke="#000" fill="none" stroke-width="3"/>
  <path d="M185 155 Q180 160 185 165" stroke="#000" fill="none" stroke-width="3"/>

  <!-- Shoulder details -->
  <line x1="95" y1="80" x2="95" y2="110" stroke="#2a2a2a" stroke-width="3"/>
  <line x1="205" y1="80" x2="205" y2="110" stroke="#2a2a2a" stroke-width="3"/>

  <!-- Belt -->
  <rect x="50" y="190" width="200" height="8" fill="#000"/>
  <rect x="145" y="188" width="10" height="12" fill="#95A5A6" stroke="#7F8C8D" stroke-width="2"/>

  <!-- Sleeve zippers -->
  <line x1="88" y1="70" x2="92" y2="85" stroke="#7F8C8D" stroke-width="2"/>
  <line x1="212" y1="70" x2="208" y2="85" stroke="#7F8C8D" stroke-width="2"/>
</svg>
