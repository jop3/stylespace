<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250">
  <!-- Jacket body -->
  <path d="M50 90 L90 70 L120 90 L120 190 L180 190 L180 90 L210 70 L250 90 L250 190 L50 190 Z"
        fill="#2E7D32" stroke="#1B5E20" stroke-width="3"/>

  <!-- Collar (stand collar) -->
  <rect x="115" y="85" width="70" height="12" rx="3" fill="#1B5E20" stroke="#0D3818" stroke-width="2"/>

  <!-- Front zipper -->
  <line x1="150" y1="97" x2="150" y2="190" stroke="#FFD700" stroke-width="6"/>
  <rect x="147" y="95" width="6" height="12" fill="#FFC107" stroke="#FF6F00" stroke-width="1"/>
  <circle cx="150" cy="101" r="5" fill="#FFD700" stroke="#FFC107" stroke-width="2"/>

  <!-- Zipper teeth -->
  <line x1="147" y1="110" x2="147" y2="185" stroke="#FF6F00" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="153" y1="110" x2="153" y2="185" stroke="#FF6F00" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Side pockets -->
  <path d="M125 135 Q130 140 125 145" stroke="#1B5E20" fill="none" stroke-width="3"/>
  <path d="M175 135 Q170 140 175 145" stroke="#1B5E20" fill="none" stroke-width="3"/>

  <!-- Ribbing at bottom -->
  <rect x="50" y="185" width="200" height="8" fill="#1B5E20" stroke="#0D3818" stroke-width="2"/>
  <line x1="55" y1="187" x2="245" y2="187" stroke="#0D3818" stroke-width="1"/>
  <line x1="55" y1="191" x2="245" y2="191" stroke="#0D3818" stroke-width="1"/>

  <!-- Ribbing at sleeves -->
  <ellipse cx="90" cy="72" rx="10" ry="16" fill="#1B5E20" stroke="#0D3818" stroke-width="2"/>
  <ellipse cx="210" cy="72" rx="10" ry="16" fill="#1B5E20" stroke="#0D3818" stroke-width="2"/>
  <line x1="85" y1="72" x2="95" y2="72" stroke="#0D3818" stroke-width="1"/>
  <line x1="205" y1="72" x2="215" y2="72" stroke="#0D3818" stroke-width="1"/>

  <!-- Shoulder patch (left) -->
  <circle cx="100" cy="95" r="12" fill="#1B5E20" stroke="#FFD700" stroke-width="2"/>
  <path d="M100 88 L103 98 L95 92 L105 92 L97 98 Z" fill="#FFD700"/>

  <!-- Chest patch -->
  <rect x="165" y="110" width="18" height="15" rx="2" fill="#FFD700" stroke="#FF6F00" stroke-width="1"/>
  <text x="174" y="121" font-family="Arial Black" font-size="10" fill="#1B5E20" text-anchor="middle" font-weight="bold">ACE</text>
</svg>
