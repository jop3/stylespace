<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <!-- Frame -->
  <rect x="20" y="35" width="70" height="30" rx="15" fill="none" stroke="#000" stroke-width="3"/>
  <rect x="110" y="35" width="70" height="30" rx="15" fill="none" stroke="#000" stroke-width="3"/>
  
  <!-- Lenses -->
  <rect x="23" y="38" width="64" height="24" rx="12" fill="#1a1a1a" opacity="0.9"/>
  <rect x="113" y="38" width="64" height="24" rx="12" fill="#1a1a1a" opacity="0.9"/>
  
  <!-- Bridge -->
  <line x1="90" y1="50" x2="110" y2="50" stroke="#000" stroke-width="3"/>
  
  <!-- Shine effect -->
  <ellipse cx="35" cy="45" rx="8" ry="5" fill="#fff" opacity="0.3"/>
  <ellipse cx="125" cy="45" rx="8" ry="5" fill="#fff" opacity="0.3"/>
</svg>
