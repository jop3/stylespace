<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <!-- Left lens -->
  <ellipse cx="50" cy="50" rx="25" ry="30" fill="#FFD700" opacity="0.3" stroke="#B8860B" stroke-width="3"/>

  <!-- Right lens -->
  <ellipse cx="150" cy="50" rx="25" ry="30" fill="#FFD700" opacity="0.3" stroke="#B8860B" stroke-width="3"/>

  <!-- Bridge -->
  <path d="M75 45 Q100 40 125 45" stroke="#B8860B" fill="none" stroke-width="3"/>

  <!-- Left temple -->
  <line x1="25" y1="50" x2="10" y2="55" stroke="#B8860B" stroke-width="3" stroke-linecap="round"/>

  <!-- Right temple -->
  <line x1="175" y1="50" x2="190" y2="55" stroke="#B8860B" stroke-width="3" stroke-linecap="round"/>

  <!-- Lens reflections -->
  <ellipse cx="45" cy="42" rx="8" ry="12" fill="#FFF" opacity="0.6"/>
  <ellipse cx="145" cy="42" rx="8" ry="12" fill="#FFF" opacity="0.6"/>
</svg>
