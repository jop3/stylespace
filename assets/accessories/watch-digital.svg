<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 200">
  <!-- Watch band top -->
  <rect x="55" y="20" width="40" height="60" fill="#2C3E50" stroke="#1A252F" stroke-width="2" rx="5"/>

  <!-- Watch face -->
  <rect x="50" y="80" width="50" height="40" fill="#34495E" stroke="#2C3E50" stroke-width="3" rx="3"/>

  <!-- Screen -->
  <rect x="55" y="85" width="40" height="30" fill="#27AE60" rx="2"/>

  <!-- Digital time display -->
  <text x="75" y="103" font-family="Courier" font-size="14" fill="#000" text-anchor="middle" font-weight="bold">12:34</text>

  <!-- Buttons -->
  <circle cx="105" cy="95" r="3" fill="#7F8C8D"/>
  <circle cx="105" cy="105" r="3" fill="#7F8C8D"/>

  <!-- Watch band bottom -->
  <rect x="55" y="120" width="40" height="60" fill="#2C3E50" stroke="#1A252F" stroke-width="2" rx="5"/>

  <!-- Band holes -->
  <circle cx="75" cy="140" r="2" fill="#1A252F"/>
  <circle cx="75" cy="150" r="2" fill="#1A252F"/>
  <circle cx="75" cy="160" r="2" fill="#1A252F"/>

  <!-- Buckle -->
  <rect x="60" y="30" width="30" height="8" fill="#95A5A6" stroke="#7F8C8D" stroke-width="1" rx="2"/>
</svg>
