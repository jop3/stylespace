<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <!-- Left lens -->
  <rect x="20" y="35" width="35" height="30" rx="5" fill="none" stroke="#000" stroke-width="4"/>
  <rect x="22" y="37" width="31" height="26" rx="4" fill="#E3F2FD" opacity="0.3"/>

  <!-- Right lens -->
  <rect x="145" y="35" width="35" height="30" rx="5" fill="none" stroke="#000" stroke-width="4"/>
  <rect x="147" y="37" width="31" height="26" rx="4" fill="#E3F2FD" opacity="0.3"/>

  <!-- Bridge -->
  <path d="M55 50 Q100 45 145 50" stroke="#000" fill="none" stroke-width="4"/>

  <!-- Left temple -->
  <line x1="20" y1="50" x2="5" y2="50" stroke="#000" stroke-width="4" stroke-linecap="round"/>

  <!-- Right temple -->
  <line x1="180" y1="50" x2="195" y2="50" stroke="#000" stroke-width="4" stroke-linecap="round"/>

  <!-- Tape in the middle (classic nerd fix) -->
  <rect x="95" y="48" width="10" height="4" fill="#FFF" stroke="#D3D3D3" stroke-width="1"/>
  <line x1="97" y1="50" x2="103" y2="50" stroke="#FFD700" stroke-width="0.5"/>
</svg>
