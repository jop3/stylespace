<svg width="150" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Golden Crown -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
  </defs>

  <g transform="translate(75, 75)">
    <!-- Crown base -->
    <path d="M -60,20 L -50,-30 L -30,0 L 0,-30 L 30,0 L 50,-30 L 60,20 Z"
          fill="url(#goldGradient)"
          stroke="#DAA520"
          stroke-width="2"/>

    <!-- Crown band -->
    <rect x="-60" y="20" width="120" height="15" fill="url(#goldGradient)" stroke="#DAA520" stroke-width="2"/>

    <!-- Jewels -->
    <circle cx="-30" cy="-10" r="5" fill="#FF1493"/>
    <circle cx="0" cy="-10" r="5" fill="#00CED1"/>
    <circle cx="30" cy="-10" r="5" fill="#9370DB"/>

    <!-- Highlights -->
    <circle cx="-30" cy="-12" r="2" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="0" cy="-12" r="2" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="30" cy="-12" r="2" fill="#FFFFFF" opacity="0.7"/>

    <!-- Shine effect -->
    <path d="M -40,-25 L -35,-20 L -45,-15" stroke="#FFFFFF" stroke-width="2" opacity="0.5" fill="none"/>
    <path d="M 10,-25 L 15,-20 L 5,-15" stroke="#FFFFFF" stroke-width="2" opacity="0.5" fill="none"/>
  </g>
</svg>
